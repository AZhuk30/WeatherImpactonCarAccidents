name: Daily Data Update Pipeline

on:
  schedule:
    # Runs daily at 2 AM UTC (9 PM EST / 10 PM EDT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'recent'
        type: choice
        options:
          - recent
          - historical
          - test

# Grant write permissions to push changes
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    env:
      SKIP_DATABASE: 'true'  # Skip database operations in GitHub Actions
    
    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    # 3. Install dependencies
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4. Create data directories
    - name: Create data directories
      run: |
        mkdir -p data/processed
        mkdir -p data/raw
        mkdir -p data/logs
    
    # 5. Clear cache to ensure fresh data
    - name: Clear API cache
      run: |
        echo "Clearing cached API data..."
        rm -f .cache.sqlite
        rm -rf __pycache__
        rm -rf src/__pycache__
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        echo "✅ Cache cleared"
    
    # 6. Run ETL Pipeline
    - name: Run ETL Pipeline
      run: |
        echo "🚀 Running ETL pipeline in GitHub Actions mode..."
        echo "SKIP_DATABASE is set to: $SKIP_DATABASE"
        
        # Use --recent flag if mode is 'recent', otherwise use the specified flag
        if [ "${{ github.event.inputs.mode }}" = "historical" ]; then
          echo "Running with --historical flag"
          python run_pipeline.py --historical
        elif [ "${{ github.event.inputs.mode }}" = "test" ]; then
          echo "Running with --test flag"
          python run_pipeline.py --test
        else
          echo "Running with --recent flag (or no flag for default 30 days)"
          python run_pipeline.py --recent || python run_pipeline.py
        fi
    
    # 7. Clean up timestamped files (keep only master files)
    - name: Clean up timestamped files
      run: |
        echo "🧹 Cleaning up timestamped files..."
        
        # Count files before cleanup
        BEFORE_COUNT=$(ls -1 data/processed/*.csv 2>/dev/null | wc -l)
        echo "Files before cleanup: $BEFORE_COUNT"
        
        # Remove timestamped files (keep master files)
        # Pattern: *_processed_YYYYMMDD_HHMMSS.csv
        find data/processed -type f -name "*_processed_*.csv" -delete
        
        # Count files after cleanup
        AFTER_COUNT=$(ls -1 data/processed/*.csv 2>/dev/null | wc -l)
        echo "Files after cleanup: $AFTER_COUNT"
        
        echo "✅ Removed $((BEFORE_COUNT - AFTER_COUNT)) timestamped files"
        
        # Show remaining files
        echo ""
        echo "📁 Remaining files:"
        ls -lh data/processed/*.csv
    
    # 8. Verify master data files exist
    - name: Verify data files
      run: |
        echo "📊 Verifying master files:"
        echo ""
        
        if [ -f "data/processed/weather_master.csv" ]; then
          WEATHER_LINES=$(wc -l < data/processed/weather_master.csv)
          WEATHER_SIZE=$(du -h data/processed/weather_master.csv | cut -f1)
          echo "✅ Weather file: $WEATHER_LINES lines ($WEATHER_SIZE)"
        else
          echo "❌ Weather master file not found!"
          echo "Available files:"
          ls -la data/processed/ || echo "Directory doesn't exist"
          exit 1
        fi
        
        if [ -f "data/processed/collisions_master.csv" ]; then
          COLLISION_LINES=$(wc -l < data/processed/collisions_master.csv)
          COLLISION_SIZE=$(du -h data/processed/collisions_master.csv | cut -f1)
          echo "✅ Collisions file: $COLLISION_LINES lines ($COLLISION_SIZE)"
        else
          echo "❌ Collisions master file not found!"
          echo "Available files:"
          ls -la data/processed/
          exit 1
        fi
    
    # 9. Commit updated data files
    - name: Commit updated data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        
        # Add only the master CSV files
        git add data/processed/weather_master.csv
        git add data/processed/collisions_master.csv
        
        # Also add .gitkeep if it exists
        git add data/processed/.gitkeep 2>/dev/null || true
        
        # Get current timestamp
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')
        
        # Get file stats for commit message
        WEATHER_LINES=$(wc -l < data/processed/weather_master.csv)
        COLLISION_LINES=$(wc -l < data/processed/collisions_master.csv)
        WEATHER_SIZE=$(du -h data/processed/weather_master.csv | cut -f1)
        COLLISION_SIZE=$(du -h data/processed/collisions_master.csv | cut -f1)
        
        # Check if there are changes
        if git diff --staged --quiet; then
          echo "No data changes detected - making keep-alive commit"
          git commit --allow-empty -m "🤖 Keep-alive: Daily check completed - $TIMESTAMP"
        else
          echo "Data files updated - committing changes"
          
          # Create multi-line commit message
          git commit -m "🤖 Auto-update: Data refresh $TIMESTAMP" \
                     -m "" \
                     -m "📊 Data Summary:" \
                     -m "- Weather: $WEATHER_LINES records ($WEATHER_SIZE)" \
                     -m "- Collisions: $COLLISION_LINES records ($COLLISION_SIZE)" \
                     -m "- Mode: ${{ github.event.inputs.mode || 'recent' }}" \
                     -m "" \
                     -m "🧹 Cleaned up: Removed timestamped backup files"
        fi
        
        # Push changes
        echo "Pushing to GitHub..."
        git push

    # 10. Create deployment summary
    - name: Create summary
      if: always()
      run: |
        echo "## 🚦 ETL Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "data/processed/weather_master.csv" ]; then
          WEATHER_LINES=$(wc -l < data/processed/weather_master.csv)
          WEATHER_SIZE=$(du -h data/processed/weather_master.csv | cut -f1)
          echo "- ✅ Weather data: $WEATHER_LINES records ($WEATHER_SIZE)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Weather data: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "data/processed/collisions_master.csv" ]; then
          COLLISION_LINES=$(wc -l < data/processed/collisions_master.csv)
          COLLISION_SIZE=$(du -h data/processed/collisions_master.csv | cut -f1)
          echo "- ✅ Collision data: $COLLISION_LINES records ($COLLISION_SIZE)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Collision data: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Mode: ${{ github.event.inputs.mode || 'recent (30 days)' }}" >> $GITHUB_STEP_SUMMARY
        echo "🕐 Completed: $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
        echo "🧹 Timestamped files: Cleaned up (only master files committed)" >> $GITHUB_STEP_SUMMARY
        
        # Show pipeline log if available
        if [ -f "data/logs/pipeline.log" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Pipeline Log (last 15 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -15 data/logs/pipeline.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
